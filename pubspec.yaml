name: liddar
description: "LiDAR 3D Room Scanner - Scan rooms and generate floor plans"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  get_storage: ^2.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.19.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  image: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
